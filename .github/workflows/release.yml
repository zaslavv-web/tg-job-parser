name: Build desktop app

# Сборка единого исполняемого файла под Windows / macOS / Linux.
# Каждый пуш — артефакты в Actions. Пуш в main — GitHub Release v<VERSION>
# (тег создаётся автоматически; чтобы выпустить новую версию — поменяйте файл VERSION).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PHP_SERIES: "8.4"
  SPC_BASE: https://dl.static-php.dev/static-php-cli

jobs:
  package:
    name: Архив приложения + склейка с рантаймом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, pdo_sqlite, curl, phar
          ini-values: phar.readonly=0
          coverage: none
      - name: Зависимости (без dev)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Тесты
        run: php tests/run.php
      - name: Архив приложения
        run: php build/build-phar.php dist/tg-job-parser.phar && php dist/tg-job-parser.phar --selftest
      - name: Рантаймы static-php-cli (micro)
        run: |
          set -euo pipefail
          mkdir -p runtime && cd runtime
          # Свежие сборки PHP ${PHP_SERIES} с набором расширений "common", от новой к старой:
          # если сервер не отдаёт последнюю (бывает 5xx), берём предыдущую патч-версию.
          versions() { curl -fsSL --retry 5 --retry-all-errors "$1" | grep -oE "$2" | sort -uV -r | head -4; }
          fetch() { # каталог, шаблон, куда, распаковщик
            for file in $(versions "$1" "$2"); do
              if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 "$1$file" -o "$3.download"; then
                echo "$3: $file"; mv "$3.download" "$3"; return 0
              fi
              echo "::warning::$file недоступен, пробую предыдущую версию"
            done
            echo "::error::Не удалось скачать рантайм по шаблону $2"; return 1
          }
          for target in linux-x86_64 macos-aarch64 macos-x86_64; do
            fetch "$SPC_BASE/common/" "php-${PHP_SERIES}\.[0-9]+-micro-${target}\.tar\.gz" "$target.tar.gz"
            mkdir -p $target && tar -xzf "$target.tar.gz" -C $target
          done
          fetch "$SPC_BASE/windows/spc-max/" "php-${PHP_SERIES}\.[0-9]+-micro-win\.zip" win.zip
          mkdir -p windows && unzip -q win.zip -d windows
          find . -name 'micro.sfx' -exec ls -la {} \;
      - name: Единые исполняемые файлы
        run: |
          set -euo pipefail
          mkdir -p out
          build/make-executable.sh runtime/linux-x86_64/micro.sfx dist/tg-job-parser.phar out/TgJobParser-linux-x64
          build/make-executable.sh runtime/macos-aarch64/micro.sfx dist/tg-job-parser.phar out/TgJobParser-macos-arm64
          build/make-executable.sh runtime/macos-x86_64/micro.sfx dist/tg-job-parser.phar out/TgJobParser-macos-x64
          build/make-executable.sh "$(find runtime/windows -name micro.sfx | head -1)" dist/tg-job-parser.phar out/TgJobParser.exe
      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: out/
          retention-days: 30

  verify:
    name: Самопроверка — ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, file: TgJobParser-linux-x64 }
          - { name: macOS (Apple Silicon), os: macos-latest, file: TgJobParser-macos-arm64 }
          - { name: Windows, os: windows-latest, file: TgJobParser.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: executables
      - name: --selftest
        shell: bash
        run: chmod +x ./${{ matrix.file }} && ./${{ matrix.file }} --selftest
      - name: Запуск сервера и ответ интерфейса
        shell: bash
        run: |
          DATA="$RUNNER_TEMP/tgjp-data"
          ./${{ matrix.file }} --no-browser --data="$DATA" > server.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fs -o page.html http://127.0.0.1:8765/; then break; fi
          done
          cat server.log
          grep -q "Радар вакансий" page.html
          curl -fs http://127.0.0.1:8765/api/health
          ls "$DATA/db"

  release:
    name: GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Опубликованный релиз не перезаписываем: новая сборка = новый номер в VERSION
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Релиз $tag уже опубликован и не будет изменён. Чтобы выпустить новую версию, увеличьте номер в файле VERSION."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: executables
          path: out
      - name: Упаковка macOS/Linux (сохранить права на запуск)
        if: steps.version.outputs.exists == 'false'
        run: |
          cd out
          for f in TgJobParser-macos-arm64 TgJobParser-macos-x64 TgJobParser-linux-x64; do chmod +x $f && zip -q $f.zip $f; done
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Радар вакансий ${{ steps.version.outputs.tag }}
          body: |
            Скачайте файл для своей системы, положите на рабочий стол и запустите двойным кликом.
            - Windows — `TgJobParser.exe`
            - macOS (M1–M4) — `TgJobParser-macos-arm64.zip`, Intel — `TgJobParser-macos-x64.zip`
            - Linux — `TgJobParser-linux-x64.zip`

            Первый запуск: Windows — «Подробнее» → «Выполнить в любом случае»; macOS — правый клик → «Открыть».
          files: |
            out/TgJobParser.exe
            out/*.zip
