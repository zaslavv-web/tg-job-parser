name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP 8.2 — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, pdo_sqlite, curl
          coverage: none
      - name: Синтаксис
        run: find src config migrations templates public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Тесты (контракты модулей, конвейер, письма, веб)
        run: php tests/run.php
      - name: Самодиагностика на чистой БД
        run: php bin/console migrate && php bin/console health
